# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: jinkang-0/ncwaa-taiji
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/d16a0124-ded7-4657-90d6-ff42036f944b/pkce
  auth_token_endpoint: /sites/d16a0124-ded7-4657-90d6-ff42036f944b/token
  gateway_url: https://gateway.decapbridge.com

  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Enable PKCE fields (optional, recommended)
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Site settings
site_url: https://www.ncwaataiji.org
logo:
  src: https://www.ncwaataiji.org/favicon.ico
  show_in_header: true

# Media settings
media_folder: "public/uploads"
public_folder: "/uploads"
media_processing:
  enabled: true
  format:
    enabled: true
    default: webp
  quality: 80
  strip_metadata: true

# Collections
collections:
  - label: "Config"
    name: "config"
    files:
      - label: "Site Config"
        name: "site"
        file: "content/config/site.yml"
        fields:
          - label: "Main Tab Title"
            name: "siteTitle"
            widget: "string"
            hint: "This is the title used as the tab title in the Info page, and as the secondary title in other pages."
          - label: "Compendium Tab Title"
            name: "compendiumTabTitle"
            widget: "string"
            hint: "This is the first text that appears on the compendium tab. It is formatted as <Compendium Tab Title> | <Main Tab Title>"
          - label: "Blog Tab Title"
            name: "blogTabTitle"
            widget: "string"
            hint: "This is the first text that appears on the blog tab. It is formatted as <Blog Tab Title> | <Main Tab Title>"
      - label: "Contacts"
        name: "contacts"
        file: "content/config/contacts.yml"
        fields:
          - label: "Instagram"
            name: "instagram"
            widget: "string"
          - label: "Facebook"
            name: "facebook"
            widget: "string"
          - label: "YouTube"
            name: "youtube"
            widget: "string"
          - label: "Email"
            name: "email"
            widget: "string"
  - label: "Page Content"
    name: "pageContent"
    files:
      - label: "Landing"
        name: "landing"
        file: "content/page/landing.yml"
        fields:
          - label: "Title"
            name: "title"
            widget: "string"
          - label: "Subtitle"
            name: "subtitle"
            widget: "string"
          - label: "Landing Photo"
            name: "landingPhoto"
            widget: "image"
            hint: "This is the large image on the landing page, it should be at least 1920x1440."
            media_processing:
              enabled: true
              format:
                enabled: true
                default: webp
              quality: 80
              strip_metadata: true
              aspect_ratio: 4x3
          - label: "Community Photos"
            name: "communityPhotos"
            widget: "list"
            fields:
              - label: "Image"
                name: "image"
                widget: "image"
                hint: "Image will be truncated to 1028x771"
                media_processing:
                  enabled: true
                  format:
                    enabled: true
                    default: webp
                  quality: 80
                  strip_metadata: true
                  width: 1028
                  height: null
                  aspect_ratio: 4x3
              - label: "Caption"
                name: "caption"
                widget: "string"
      - label: "About Section"
        name: "aboutSection"
        file: "content/page/about.yml"
        fields:
          - label: "Title"
            name: "title"
            widget: "string"
          - label: "Intro Video URL"
            name: "introVideo"
            widget: "string"
          - label: "Show Intro Video"
            name: "showIntroVideo"
            widget: "boolean"
          - label: "Section 1 Text"
            name: "section1Text"
            widget: "richtext"
          - label: "Section 2 Text"
            name: "section2Text"
            widget: "richtext"
      - label: "Schedule Section"
        name: "scheduleSection"
        file: "content/page/schedule.yml"
        fields:
          - label: "Title"
            name: "title"
            widget: "string"
          - label: "Intro Text"
            name: "introText"
            widget: "richtext"
          - label: "Show Special Announcement"
            name: "showSpecialAnnouncement"
            widget: "boolean"
          - label: "Special Announcement"
            name: "specialAnnouncement"
            widget: "string"
          - label: "Class Start Date"
            name: "classStartDate"
            widget: "datetime"
            date_format: "LL"
          - label: "Class End Date"
            name: "classEndDate"
            widget: "datetime"
            date_format: "LL"
          - label: "Registration Start Date"
            name: "registrationStartDate"
            widget: "datetime"
            date_format: "LL"
          - label: "Force Class in Session"
            name: "forceClassInSession"
            hint: "Leave as false to let it depend on class start date, toggle on to manually indicate class has started."
            widget: "boolean"
            default: false
          - label: "Show Schedule"
            name: "showSchedule"
            widget: "boolean"
            default: false
          - label: "Schedule"
            name: "schedule"
            widget: "list"
            fields:
              - label: "Day of the Week"
                name: "day"
                widget: "select"
                options:
                  - "Sunday"
                  - "Monday"
                  - "Tuesday"
                  - "Wednesday"
                  - "Thursday"
                  - "Friday"
                  - "Saturday"
                hint: "The displayed time is in your local timezone, make sure you don't have a VPN on, or ensure your calculations are correct."
              - label: "Start Time"
                name: "startTime"
                widget: "datetime"
                time_format: "LT"
                hint: "The displayed time is in your local timezone, make sure you don't have a VPN on, or ensure your calculations are correct."
              - label: "End Time"
                name: "endTime"
                widget: "datetime"
                time_format: "LT"
                hint: "The displayed time is in your local timezone, make sure you don't have a VPN on, or ensure your calcualtions are correct."
              - label: "Location"
                name: "location"
                widget: "string"
              - label: "Location Alternative Name"
                name: "locationAlternative"
                required: false
                widget: "string"
                hint: "An alternative name for the location (optional)"
          - label: "Registration Link"
            name: "registrationLink"
            widget: "string"
            hint: "The primary registration link."
          - label: "Secondary Registration Link"
            name: "registrationLinkSecondary"
            widget: "string"
            hint: "The secondary registration link (e.g. online)."
          - label: "Subtext"
            name: "subtext"
            widget: "richtext"
            hint: "The text displayed below registration buttons."
      - label: "Events Section"
        name: "eventsSection"
        file: "content/page/events.yml"
        fields:
          - label: "Title"
            name: "title"
            widget: "string"
          - label: "Events"
            name: "events"
            widget: "list"
            fields:
              - label: "Name"
                name: "name"
                widget: "string"
              - label: "Date"
                name: "date"
                widget: "datetime"
                date_format: "LL"
                hint: "The (start) date of the event. The displayed time is in your timezone."
              - label: "End Date"
                name: "endDate"
                widget: "datetime"
                time_format: "LT"
                required: false
                hint: "The end date of the event, optional if the event is only one day. The displayed time is in your timezone."
              - label: "Start Time"
                name: "startTime"
                widget: "datetime"
                time_format: "LT"
                hint: "The displayed time is in your timezone, make sure you don't have a VPN on, or ensure your calculations are correct."
              - label: "End Time"
                name: "endTime"
                widget: "datetime"
                time_format: "LT"
                hint: "The displayed time is in your timezone, make sure you don't have a VPN on, or ensure your calculations are correct."
              - label: "Location"
                name: "location"
                widget: "string"
              - label: "Location URL"
                name: "locationUrl"
                widget: "string"
                required: false
                hint: "A link to a map service (e.g. Google Maps) or virtual meeting link (e.g. Zoom)."
              - label: "Attachments"
                name: "attachments"
                widget: "list"
                fields:
                  - label: "Name"
                    name: "name"
                    widget: "string"
                  - label: "URL"
                    name: "url"
                    widget: "string"
                  - label: "Type"
                    name: "type"
                    widget: "select"
                    options: ["Website", "File", "Image", "General"]
                    default: "General"
          - label: "Max Events"
            name: "maxEvents"
            widget: "number"
            hint: "The maximum number of visible events when visitors expand the events list."
            value_type: "int"
            min: 1
            step: 1
      - label: "Instructors Section"
        name: "instructorsSection"
        file: "content/page/instructors.yml"
        fields:
          - label: "Title"
            name: "title"
            widget: "string"
          - label: "Instructors"
            name: "instructors"
            widget: "list"
            fields:
              - label: "Portrait"
                name: "portrait"
                widget: "image"
                hint: "Portrait should have an aspect ratio of 3:4."
                media_processing:
                  enabled: true
                  format:
                    enabled: true
                    default: webp
                  quality: 80
                  strip_metadata: true
                  width: 600
                  aspect_ratio: 3x4
              - label: "Full Name"
                name: "fullName"
                widget: "string"
              - label: "Role"
                name: "role"
                widget: "string"
              - label: "Biography"
                name: "biography"
                widget: "richtext"
      - label: "FAQ Section"
        name: "faqSection"
        file: "content/page/faqs.yml"
        fields:
          - label: "Title"
            name: "title"
            widget: "string"
          - label: "Subtext"
            name: "subtext"
            widget: "richtext"
          - label: "FAQs"
            name: "faqs"
            widget: "list"
            fields:
              - label: "Question"
                name: "question"
                widget: "string"
              - label: "Answer"
                name: "answer"
                widget: "richtext"
      - label: "Compendium"
        name: "compendium"
        file: "content/page/compendium.yml"
        fields:
          - label: "Collections"
            name: "collections"
            widget: "list"
            fields:
              - label: "Title"
                name: "title"
                widget: "string"
              - label: "Type"
                name: "type"
                widget: "select"
                options: ["Featured", "Default"]
                default: "Default"
              - label: "Forms"
                name: "forms"
                widget: "list"
                field:
                  label: "Form"
                  name: "form"
                  widget: "relation"
                  collection: "forms"
                  search_fields: ["name"]
                  value_field: "{{slug}}"
                  display_fields: ["name"]
                  hint: "Add forms in the 'Forms' collection first, then organize them here."
  - label: "Blogs"
    name: "blogs"
    folder: "content/blogs"
    create: true
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
      - label: "Thumbnail"
        name: "thumbnail"
        widget: "image"
        media_processing:
          enabled: true
          format:
            enabled: true
            default: webp
          quality: 80
          strip_metadata: true
          width: 800
          height: null
          aspect_ratio: 2x1
      - label: "Authors"
        name: "authors"
        widget: "list"
        field:
          label: "Author Name"
          name: "authorName"
          widget: "string"
      - label: "Summary"
        name: "summary"
        widget: "string"
        hint: "A short summary on the feed page to give people an idea of what this blog is about. For simplicity, you can copy-paste the first three sentences of the blog."
      - label: "Content"
        name: "content"
        widget: "richtext"
  - label: "Compendium Forms"
    name: "forms"
    folder: "content/forms"
    create: true
    identifier_field: id
    fields:
      - label: "ID"
        name: "id"
        widget: "string"
        hint: "A unique ID for this form, usually the name in kebab case (e.g. name-of-the-form)"
      - label: "Name"
        name: "name"
        widget: "string"
      - label: "Thumbnail"
        name: "thumbnail"
        widget: "image"
        media_processing:
          enabled: true
          format:
            enabled: true
            default: webp
          quality: 80
          strip_metadata: true
          width: 1400
          height: null
          aspect_ratio: 5x3
      - label: "Type"
        name: "type"
        widget: "select"
        options: ["Exercise", "Project", "Competition", "Qigong", "Core"]
      - label: "Other Names"
        name: "otherNames"
        widget: "list"
        field:
          label: "Name"
          name: "name"
          widget: "string"
      - label: "Subtitle"
        name: "subtitle"
        widget: "string"
      - label: "Description"
        name: "description"
        widget: "richtext"
