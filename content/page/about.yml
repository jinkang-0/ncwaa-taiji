section2Text: >-
  The National Chinese Wushu Association of America, headed by Bryant Fong,
  traces its origins as an established association to 1978, while its official
  501(c)(3) federal tax-exempt nonprofit status was formally issued by the IRS
  in July 2008. It is one of the oldest recorded Wushu associations in the
  United States, dedicated to traditional and modern wushu promotion.\

  \

  Our taiji program was established in 1969 as part of the [University of California Martial Arts Program (UCMAP)](https://recwell.berkeley.edu/competitive-programs/martial-arts/adult-martial-arts/) at the University of California, Berkeley. As such, we have also assumed names such as CalTaiji or UC Berkeley Taiji to represent our affiliation.
title: About
introVideo: https://www.youtube.com/watch?v=gaTWVRzd_Ys
showIntroVideo: true
section1Text: >-
  Tai chi, as a practice, is popularly regarded as a health and wellness
  exercise and martial arts technique. In our class, we place an emphasis on
  health and wellness to help our students improve their physical abilities
  and manage daily stress through moving meditation and exercises.\

  \

  For the advanced or ambitious students, we also offer opportunities to deepen your understanding of tai chi as a martial art. This varies across weapons, unhanded combat techniques, and soft energy skills.\

  \

  We welcome all students, regardless of prior experience, age, or physical aptitude. Whether you are a beginner or an experienced practitioner, you will find a place in our community.
