subtext: >-
  Online-only members and UC Berkeley students, alumni, and faculty can
  receive discounts. Regular members can attend both in person and online
  classes.


  \* For online-only members, please email us at [taiji@ucmap.org](mailto:taiji@ucmap.org) for the Zoom information after signing up.
title: Schedule
introText: In person practice is held at the [Recreational Sports Facility
  (RSF)](https://maps.app.goo.gl/GpMWC5rYSyyKmeB27) on the UC Berkeley campus.
  All skill levels are welcome! New members can try out their first week of
  classes for free.
