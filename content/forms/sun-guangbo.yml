id: sun-guangbo
name: Sun Guangbo
thumbnail: /uploads/guangbo.webp
type: Core
otherNames:
  - 孙氏太极广播操
subtitle: A concise form of Sun-style tai chi, covering a plethora of common Sun style techniques.
description: >-
  Sun Guangbo is another simplified form of Sun-style tai chi that we teach as a core form to beginners. It covers almost all of the common Sun style techniques, making it a great way to learn the style.
