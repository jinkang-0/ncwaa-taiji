id: yang-32-sword
name: Yang 32 Straight Sword
thumbnail: /uploads/yang32.webp
type: Competition
otherNames:
  - 杨氏三十二式剑
subtitle: A traditional Yang-style sword form.
description: >-
  The Yang 32 straight sword form is a simplified version of the
  traditional Yang-style sword form. It covers the essential movements
  and techniques of the Yang sword style, making it a great introductory
  form for those interested in learning tai chi sword techniques.



  Due to its elegant and flowing movements, the Yang 32 sword form is
  often performed in competitions and demonstrations.
