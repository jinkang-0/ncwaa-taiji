id: bagua-fan-1
name: Kun Lun Fan
thumbnail: /uploads/bagua-fan-1.webp
type: Project
otherNames:
  - 昆仑扇
subtitle: The first of three Bagua fan forms, also called the Kun Lun Fan.
description: >-
  The first of the three fan sets in Bagua, also referred to as Kun Lun
  Fan. This fan set is a more challenging version of fan as compared to
  the [Taiji Bagua Fan](/compendium?id=taiji-bagua-fan), but is easier in comparison to the other two fan sets in Bagua. The
  Bagua fan is notoriously famous for its difficulty to learn, which is
  why it could be a lifelong pursuit for some practitioners.
