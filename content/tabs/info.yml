faqSection:
  subtext: Have other questions? Email us at [taiji@ucmap.org](mailto:taiji@ucmap.org)!
  title: FAQ
  faqs:
    - answer: >-
        Tai chi, or taijiquan, is one of the three major internal Chinese
        martial arts, alongside Xingyi and Bagua. Tai chi was traditionally
        developed as a martial art, but is more popularly practiced today as a
        form of moving meditation and health exercise.\

        \

        As a martial art, tai chi incorporates techniques like spiraling and [qin na](https://en.wikipedia.org/wiki/Chin_Na) to deliver force and neutralize opponents. At advanced levels of neigong practice, it usually involves grounding or redirect the opponent's force, or applying force through the use of internal energy.\

        \

        Unfortunately, advanced understanding of internal energy often takes decades to develop through diligent practice. As such, our class advertises and takes an emphasis on the health and wellness practice of tai chi. But, if you are interested, we are happy to discuss the martial aspects of tai chi, and how it can be applied in self-defense.\

        \

        That said, we still promote the understanding of internal energy as a core part of our practice, as it is not only useful for self-defense, but also a vital enrichment in life! If you are interested in learning more about the neigong aspect, we're happy to discuss it with you in class or over email.
      question: What is tai chi?
    - answer: >-
        Internal energy, or "qi", is a concept in traditional Chinese medicine
        and martial arts that refers to the vital life force that flows through
        the body. It is believed that by cultivating and balancing this energy,
        one can improve their physical and mental health, as well as enhance
        their martial arts practice.\

        \

        In tai chi, practitioners learn to feel and manipulate this energy through their movements and breathing. This is often done through exercises like qigong, which are designed to help cultivate and balance the flow of qi in the body.\

        \

        It is important to note that the concept of qi is not scientifically understood, and is often viewed as a metaphor for unexplained phenomena in the body. However, with increasing advancements in traditional Chinese medicine and the fascia and nervous systems, we are starting to understand the physiological responses of the body, and this may help explain the concept of qi and its related phenomena in a more scientific way.\

        \

        Note: "qi" is sometimes spelled as "chi" or "ki", depending on the context and tradition. However, this is not the same as the "chi" in tai chi, which directly translates to "supreme ultimate" and refers to the philosophical concept of yin and yang.
      question: What is internal energy, or qi?
    - answer: >-
        To be clear, we are not medical professionals and do not claim that tai
        chi is a cure for any medical condition. While there are anecdotal
        evidence that tai chi has helped folks overcome conditions they couldn't
        with medication, it is important to understand that everyone's situation
        is different. It is always best to consult with a medical professional
        if your goal is to use tai chi to treat a specific condition, especially
        if you are limited by physical ailments.\

        \

        Having said that, there is generally a consensus that tai chi is beneficial for overall health and wellness. It is a low-impact exercise that can be practiced by people of all ages and fitness levels. Below are a few health benefits of tai chi that have been observed from medical studies.\

        \

        Tai chi has been linked to more resistant tendons, stronger muscles, better flexibility, increased spatial awareness, improved balancing, and some degree of aerobic conditioning without raising the heartbeat (see [this article from Harvard Medical School](https://www.health.harvard.edu/staying-healthy/the-health-benefits-of-tai-chi)). Tai chi is also positively linked with [enhanced memory and cognitive function](https://www.alzinfo.org/articles/prevention/tai-chi-for-brain-health/) and [reduced chances of dementia](https://www.health.harvard.edu/mind-and-mood/a-sharper-mind-tai-chi-can-improve-cognitive-function).\

        \

        For readers curious in learning more, you can find more sources online discussing the health benefits of tai chi. A good source to get started on is [The Harvard Medical School Guide to Tai Chi](https://a.co/d/eGcBFL1), published in 2013, which discusses the benefits of tai chi from medical studies. You are also welcome to email us or join in for the first week for free to learn more!\

        \

        As always, one must be careful to not overexert themselves, as tai chi is still a physical activity. If you feel any pain or discomfort while practicing, please stop and rest. It is important to listen to your body and not push yourself too hard.
      question: What are the health benefits of tai chi?
    - answer: >-
        We do not use a belt system or any other ranking system to classify
        practitioners. In tai chi, we generally recognize your understanding of
        the essence of the art far more than your ability to memorize and
        perform a form.\

        \

        That is, are you able to feel energy ("qi")? Perhaps as tingling sensations in your hands, or a sense of heaviness in your limbs? Are you able to express energy through your movements and direct it towards or into your opponent?\

        \

        Of course, memorizing and performing forms is important, but it is not the end goal of tai chi. What is important is your personal growth in the internal arts and your ability to apply tai chi in your life, to shape it to your needs, and to understand the art in a way that is meaningful to you.
      question: Are there ranks in tai chi?
    - answer: >-
        Not at all!\

        \

        For context, we schedule many performance events throughout the year — for holiday occassions, local school demos, or martial arts competitions. These events are a great way to engage with the community, spread awareness of tai chi, and experience the vibrant scene of kung fu practiced in the Bay Area.\

        \

        While we do encourage members to perform at these events, it is certainly not a requirement to be a part of the club. These events are completely optional. We just want to provide the opportunity for those who are interested to showcase their skills and engage with the community.\

        \

        That said, if you are at all interested in performing, we would highly encourage you to join us! It is a great way to build confidence and showcase your skills. Even if you are not performing, we encourage all members to attend these events to support the community and learn from others. You can also volunteer to help out with the event, which is a great way to get involved!
      question: Are members required to perform at events?
    - answer: >-
        We start class with some joint loosening and spiraling exercises, which
        serves as both a warm up and, for some, a good stress relief. After
        that, it is usually followed up with a stretch or qigong, which helps
        practitioners build sensitivity of internal energy ("qi").\

        \

        If you are doing the online class, we will follow it up with either an extended session of qigong or a form practice.\

        \

        For in person classes, we split off into groups. Beginners will practice the fundamental forms while intermediate members work on their own projects under the guidance of Sifu Fong. Sometimes, there will be a group practice where everyone practices the same form together, which is a great way to learn from each other.\

        \

        It's important to note that forms are taught piece by piece. No one is shown a complete form and expected to remember it. You're welcome to take as much time and repetitions as you need to understand the core concepts. Don't be afraid to interrupt and ask questions!
      question: How are classes organized?
    - answer: >-
        If you are new to tai chi, we will start you off by working on your
        footwork, your sensitivity towards energy, and expression of energy with
        three fundamental forms. Sun 12 in the Fall, Sun Guangbo in the Spring,
        and Bafa Wubu in the Summer.\

        \

        For practitioners who already have experience in tai chi, or have completed their fundamentals, they can choose to work on a project. Whether that is a form, a weapon, or an application, it is up to you to decide what you want to work on. If you are unsure, instructors are happy to help you find a project that suits your interests and skill level.\

        \

        We're fortunate to have Sifu Bryant Fong who's knowledgeable in a broad range of traditional Chinese martial arts to provide pointers for Chen, Yang, and Sun style tai chi; for weapons like swords, fans, and staff; and for other martial arts like Baguazhang and Xingyiquan.\

        \

        For a compendium of forms practiced by students currently or in the recent past, you can check out our [Compendium page](https://www.ncwaataiji.org/compendium).
      question: What forms are practiced?
    - answer: >-
        Don't worry! We understand that life (especially as a student) can get
        busy, and it's not uncommon for members to miss classes from time to
        time. If you miss a class, you can always catch up by attending the next
        class.\

        \

        Ultimately, it is up to you to decide how much you want to practice. We encourage you to attend classes regularly, but we also understand that everyone has different schedules and commitments.
      question: What happens if I miss a class?
instructorsSection:
  title: Instructors
  instructors:
    - biography: >-
        Hunyuan Taijiquan master and a 5th generation Bagua master. Sifu Fong
        has competed nationally and internationally, and served as the coach for
        the US Wushu Team at the 1st World Wushu Championships. Currently, he is
        the coach for the San Francisco Wushu Team and head instructor of both
        CalTaiji and CalWushu at UC Berkeley.\

        \

        Sifu Fong is proficient in both traditional as well as modern Wushu. He is a graduate of the San Francisco Jing-Wu Academy, under the instruction of the famous Grandmaster Jackman Wong, a master of Taijiquan, Xingyiquan, and Northern Shaolin, well known for his fight with the legendary Bruce Lee. Sifu Fong also studied with his uncle, Master Quentin Fong, whose specialty is the Tibetan White Crane System.\

        \

        Sifu Fong was one of the few Americans to perform with China's top Wushu Team, the Beijing Wushu Team, under the direction of Jet Li's coach, Wu Bin. Sifu Fong has also authored many articles for Inside Kung-fu, Tai Chi Journal, Tai Chi Kung-fu Magazine, and Reader's Digest. He is a recognized authority on the history, culture, and techniques of Wushu, both modern and traditional.


